name: Build CDN Website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web-dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make router CDN-safe for this build
        run: |
          sed -i "s/import { BrowserRouter }/import { HashRouter }/" src/main.tsx
          sed -i "s#<BrowserRouter basename={import.meta.env.BASE_URL.replace(/\\\/$/, '') || '/'}>#<HashRouter>#" src/main.tsx
          sed -i "s#</BrowserRouter>#</HashRouter>#" src/main.tsx
      - run: npm run build -- --base "./"
      - name: Publish compiled website into repository
        run: |
          rm -rf web-dist
          mkdir web-dist
          cp -R dist/. web-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web-dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update compiled CDN website [skip ci]"
          git push
